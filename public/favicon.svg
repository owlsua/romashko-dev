<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" style="image-rendering:pixelated">
  <!-- Head dark outline -->
  <rect x="8" y="3" width="16" height="2" fill="#1a2e52"/>
  <rect x="6" y="5" width="20" height="2" fill="#1a2e52"/>
  <rect x="5" y="7" width="22" height="12" fill="#1a2e52"/>
  <rect x="6" y="19" width="20" height="2" fill="#1a2e52"/>

  <!-- Head main fill -->
  <rect x="9" y="4" width="14" height="2" fill="#4a86e8"/>
  <rect x="7" y="6" width="18" height="2" fill="#4a86e8"/>
  <rect x="6" y="8" width="20" height="10" fill="#4a86e8"/>
  <rect x="7" y="18" width="18" height="2" fill="#4a86e8"/>

  <!-- Head highlight -->
  <rect x="11" y="5" width="6" height="2" fill="#90caf9"/>
  <rect x="9" y="7" width="4" height="2" fill="#90caf9"/>

  <!-- Left eye white -->
  <rect x="9" y="11" width="5" height="4" fill="#fff"/>
  <!-- Left pupil -->
  <rect x="11" y="12" width="3" height="3" fill="#1a1a1a"/>
  <!-- Left eye shine -->
  <rect x="11" y="12" width="1" height="1" fill="#fff" opacity="0.6"/>

  <!-- Right eye white -->
  <rect x="18" y="11" width="5" height="4" fill="#fff"/>
  <!-- Right pupil -->
  <rect x="18" y="12" width="3" height="3" fill="#1a1a1a"/>
  <!-- Right eye shine -->
  <rect x="18" y="12" width="1" height="1" fill="#fff" opacity="0.6"/>

  <!-- Mouth -->
  <rect x="14" y="16" width="4" height="1" fill="#1a237e" opacity="0.35"/>

  <!-- Tentacles -->
  <!-- T1 far left -->
  <rect x="5" y="20" width="3" height="3" fill="#4a86e8"/>
  <rect x="4" y="23" width="2" height="3" fill="#4a86e8"/>
  <rect x="3" y="26" width="2" height="2" fill="#4a86e8"/>
  <rect x="3" y="28" width="1" height="2" fill="#e0e0e0"/>

  <!-- T2 inner left -->
  <rect x="10" y="20" width="3" height="3" fill="#4a86e8"/>
  <rect x="10" y="23" width="2" height="3" fill="#4a86e8"/>
  <rect x="10" y="26" width="2" height="2" fill="#4a86e8"/>
  <rect x="10" y="28" width="1" height="2" fill="#e0e0e0"/>

  <!-- T3 inner right -->
  <rect x="19" y="20" width="3" height="3" fill="#4a86e8"/>
  <rect x="20" y="23" width="2" height="3" fill="#4a86e8"/>
  <rect x="20" y="26" width="2" height="2" fill="#4a86e8"/>
  <rect x="21" y="28" width="1" height="2" fill="#e0e0e0"/>

  <!-- T4 far right -->
  <rect x="24" y="20" width="3" height="3" fill="#4a86e8"/>
  <rect x="26" y="23" width="2" height="3" fill="#4a86e8"/>
  <rect x="27" y="26" width="2" height="2" fill="#4a86e8"/>
  <rect x="28" y="28" width="1" height="2" fill="#e0e0e0"/>
</svg>
